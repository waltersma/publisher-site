<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Independent Publisher</title>
    <style>
        :root {
            --bg-color: #f7f6f2;
            --card-bg: #ffffff;
            --text-color: #1a1a1a;
            --accent-color: #222222;
            --amazon-btn: #ff9900;
            --amazon-hover: #e68a00;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            text-align: center;
            padding: 40px 20px 20px;
        }

        header img.logo {
            max-width: 280px;
            height: auto;
        }

        main {
            flex: 1;
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
            width: 100%;
        }

        .featured-book {
            background-color: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid #eaeaea;
        }

        @media (min-width: 650px) {
            .featured-book {
                flex-direction: row;
            }
        }

        .cover-container {
            background-color: #111;
            padding: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex: 1;
        }

        .cover-container img {
            max-width: 240px;
            width: 100%;
            height: auto;
            border-radius: 4px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }

        .details-container {
            padding: 35px;
            flex: 1.3;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .tag {
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 1px;
            color: #666;
            font-weight: 600;
            margin-bottom: 8px;
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 5px;
            color: var(--accent-color);
            line-height: 1.2;
        }

        .author {
            font-size: 1.1rem;
            font-weight: 600;
            color: #444;
            margin-bottom: 15px;
        }

        .synopsis {
            font-size: 0.95rem;
            color: #555;
            margin-bottom: 25px;
        }

        .buy-btn {
            display: inline-block;
            background-color: var(--amazon-btn);
            color: #111;
            font-weight: bold;
            text-decoration: none;
            padding: 14px 28px;
            border-radius: 6px;
            text-align: center;
            font-size: 1.05rem;
            transition: background 0.2s ease;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .buy-btn:hover {
            background-color: var(--amazon-hover);
        }

        footer {
            text-align: center;
            padding: 40px 20px;
            font-size: 0.9rem;
            color: #666;
            border-top: 1px solid #e5e5e5;
            margin-top: 40px;
        }

        footer a {
            color: var(--accent-color);
            text-decoration: none;
            font-weight: 600;
        }

        footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <header>
        <!-- Place your logo image in the same folder as this HTML file -->
        <img src="logo.png" alt="Logo" class="logo">
    </header>

    <main>
        <section class="featured-book">
            <div class="cover-container">
                <!-- Place your book cover image in the same folder as this HTML file -->
                <img src="cover.jpg" alt="Book Cover">
            </div>
            <div class="details-container">
                <span class="tag">Featured Release</span>
                <h1>Book title</h1>
                <div class="author">by J Smith</div>
                <p class="synopsis">
                    description
                </p>
                <!-- Replace 'YOUR_AMAZON_ASIN_OR_LINK' with your actual Amazon product link -->
                <a href="https://www.amazon.co.uk/dp/YOUR_AMAZON_ASIN_OR_LINK" class="buy-btn" target="_blank" rel="noopener">
                    Buy on Amazon
                </a>
            </div>
        </section>
    </main>

    <footer>
        <p>Publisher&copy; 2026 | All Rights Reserved</p>
        <p style="margin-top: 8px;">
            Contact: <a href="mailto:contact@aerieink.co.uk">contact@hey.co.uk</a>
        </p>
    </footer>

</body>
  </html>
